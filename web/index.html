<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Resistencia Cósmica, un platformer 2D.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07020F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resistencia Cósmica">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Resistencia Cósmica</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #07020F;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    flutter-view,
    flt-glass-pane {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
    #rc-loading {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07020F;
      color: #ffffff;
      font: 700 22px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      pointer-events: none;
    }
    html.rc-ready #rc-loading {
      display: none !important;
    }
    #rc-fs-gate {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #07020F;
      color: #ffffff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    html.rc-standalone #rc-fs-gate,
    html.rc-playing #rc-fs-gate {
      display: none !important;
    }
    #rc-fs-play {
      width: 92px;
      height: 92px;
      border: 0;
      border-radius: 50%;
      background: #d0089a;
      color: #ffffff;
      font-size: 42px;
      line-height: 92px;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 0 0 8px rgba(208, 8, 154, 0.28);
      transition: transform 90ms ease-out, filter 90ms ease-out;
    }
    #rc-fs-gate:hover #rc-fs-play {
      transform: scale(1.05);
      filter: brightness(1.18);
    }
    #rc-fs-gate:active #rc-fs-play {
      transform: scale(0.88) translateY(5px);
      filter: brightness(1.45);
    }
    #rc-fs-label {
      font: 700 20px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      pointer-events: none;
    }
    :fullscreen, :-webkit-full-screen {
      width: 100% !important;
      height: 100% !important;
      background: #07020F;
    }
  </style>
</head>
<body>
  <div id="rc-loading">Cargando…</div>
  <div id="rc-fs-gate" role="button" tabindex="0">
    <div id="rc-fs-play" aria-hidden="true">▶</div>
    <div id="rc-fs-label">Tocá para jugar</div>
  </div>
  <script>
    (function () {
      const root = document.documentElement;
      const loading = document.getElementById('rc-loading');
      const gate = document.getElementById('rc-fs-gate');

      function markReady() {
        root.classList.add('rc-ready');
        if (loading && loading.parentNode) loading.remove();
        window.dispatchEvent(new Event('resize'));
      }

      window.addEventListener('flutter-first-frame', markReady);
      window.addEventListener('load', function () {
        if (document.querySelector('flt-glass-pane, flutter-view, canvas')) {
          markReady();
        }
      });
      const readyWatch = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view, canvas')) {
          markReady();
          readyWatch.disconnect();
        }
      });
      readyWatch.observe(document.documentElement, { childList: true, subtree: true });
      window.setTimeout(markReady, 8000);

      const standalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.navigator.standalone === true;

      function notifyLayout() {
        window.dispatchEvent(new Event('resize'));
      }

      function isNativeFullscreen() {
        return !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.msFullscreenElement
        );
      }

      function startPlaying() {
        root.classList.add('rc-playing');
        if (gate && gate.parentNode) gate.remove();
        notifyLayout();
      }

      function requestPageFullscreen() {
        const targets = [document.documentElement, document.body];
        for (let i = 0; i < targets.length; i++) {
          const el = targets[i];
          const req =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.webkitRequestFullScreen ||
            el.msRequestFullscreen;
          if (!req) continue;
          try {
            const result = req.call(el, { navigationUI: 'hide' });
            if (result && typeof result.then === 'function') {
              result.catch(function () {
                try { req.call(el); } catch (_) {}
              });
            }
            return true;
          } catch (_) {
            try {
              req.call(el);
              return true;
            } catch (__) {}
          }
        }
        return false;
      }

      function enterFullscreen() {
        if (standalone || isNativeFullscreen()) return;
        requestPageFullscreen();
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {});
        }
      }

      if (standalone) {
        root.classList.add('rc-standalone');
        startPlaying();
        return;
      }

      let started = false;

      function unlockAudio() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          const ctx = window.__rcAudioCtx || new Ctx();
          window.__rcAudioCtx = ctx;
          if (ctx.state === 'suspended') ctx.resume();
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
        } catch (_) {}
        const urls = [
          'assets/assets/sfx/ui_button.mp3',
          'assets/sfx/ui_button.mp3',
        ];
        for (let i = 0; i < urls.length; i++) {
          try {
            const click = new Audio(urls[i]);
            click.volume = 1;
            const played = click.play();
            if (played && typeof played.catch === 'function') {
              played.catch(function () {});
            }
            break;
          } catch (_) {}
        }
      }

      function onPlayGesture(event) {
        event.preventDefault();
        event.stopPropagation();
        if (started) return;
        started = true;
        unlockAudio();
        enterFullscreen();
        startPlaying();
      }

      if (gate) {
        gate.addEventListener('pointerup', onPlayGesture);
        gate.addEventListener('click', onPlayGesture);
        gate.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') onPlayGesture(event);
        });
      }

      document.addEventListener('fullscreenchange', notifyLayout);
      document.addEventListener('webkitfullscreenchange', notifyLayout);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
