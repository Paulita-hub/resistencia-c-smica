name: game_template
description: Resistencia Cósmica, un platformer 2D en Flutter y Flame.
version: 0.0.1+1

# Prevent accidental publishing to pub.dev.
publish_to: 'none'


environment:
  sdk: ^3.9.0-0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  cupertino_icons: ^1.0.2
  flame: ^1.34.0
  go_router: ^16.0.0
  logging: ^1.1.0
  provider: ^6.0.2
  shared_preferences: ^2.0.13

  # If you don't need one of the following dependencies,
  # delete the relevant line below, and get rid of any Dart code
  # that references the dependency.
  firebase_core: ^4.0.0  # Needed for Crashlytics below
  firebase_crashlytics: ^5.0.0  # Error reporting
  games_services: ^4.0.0  # Achievements and leaderboards
  google_mobile_ads: ^6.0.0  # Ads
  in_app_purchase: ^3.0.1  # In-app purchases

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  test: ^1.19.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/levels/1/
    - assets/images/levels/2/
    - assets/images/levels/3/
    - assets/images/characters/hero_1/
    - assets/images/characters/hero_2/
    - assets/images/characters/hero_3/
    - assets/images/items/
    - assets/images/ui/
    - assets/images/hud/
    - assets/images/hud/controls/
    - assets/images/hud/victory/
    - assets/music/
    - assets/sfx/

  fonts:
    - family: Permanent Marker
      fonts:
        - asset: assets/Permanent_Marker/PermanentMarker-Regular.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon-adaptive-foreground.png"
